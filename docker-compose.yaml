services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 120s
    networks:
      - symfony-network

  webserver:
    image: nginx:latest
    container_name: symfony_nginx
    ports:
      - "8100:80"
      - "8444:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      php:
        condition: service_healthy
    networks:
      - symfony-network

networks:
  symfony-network:
    driver: bridge
