services:
  php:
    build: .
    container_name: symfony-php
    volumes:
      - ./:/var/www/html
    networks:
      - symfony-network
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    container_name: symfony-nginx
    ports:
      - "8100:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html:ro
    depends_on:
      - php
    networks:
      - symfony-network

  database:
    image: postgres:16-alpine
    container_name: symfony-database
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: Pandora2137#
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - symfony-network

  adminer:
    image: adminer
    container_name: symfony-adminer
    restart: always
    ports:
      - "8085:8080"
    networks:
      - symfony-network

networks:
  symfony-network:
    driver: bridge

volumes:
  database_data:
